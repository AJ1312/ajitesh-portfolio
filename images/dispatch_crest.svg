<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Circular Red / Terracotta Seal Base -->
  <circle cx="100" cy="100" r="96" fill="#D32F2F" stroke="#B71C1C" stroke-width="4" />
  
  <!-- Outer Dashed Ring -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="3,3" opacity="0.85" />
  
  <!-- Inner Solid Ring -->
  <circle cx="100" cy="100" r="82" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.9" />

  <!-- Circular Text Path -->
  <path id="textCircle" d="M 100, 100 m -64, 0 a 64,64 0 1,1 128,0 a 64,64 0 1,1 -128,0" fill="none" />
  
  <text font-family="'JetBrains Mono', 'Courier New', monospace" font-size="10.5" font-weight="700" fill="#FFFFFF" letter-spacing="2.5">
    <textPath href="#textCircle" startOffset="50%" text-anchor="middle">
      THE SHARMA DISPATCH &#8226; VELLORE &#8226;
    </textPath>
  </text>

  <!-- Center Decorative Crest -->
  <g transform="translate(100, 100) scale(0.9)">
    <!-- Central Monogram & Star Crest -->
    <path d="M-28,-8 L0,-32 L28,-8 L18,-4 L0,-20 L-18,-4 Z" fill="#FFFFFF" opacity="0.95" />
    <circle cx="0" cy="0" r="22" fill="#B71C1C" stroke="#FFFFFF" stroke-width="2" />
    <text x="0" y="7" font-family="'Playfair Display', serif" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle">AS</text>
    <path d="M-28,8 L0,32 L28,8 L18,4 L0,20 L-18,4 Z" fill="#FFFFFF" opacity="0.95" />
  </g>
</svg>
